# 在项目根目录运行 xcodegen generate，生成主应用与 macOS Widget 工程。
name: SucculentGarden
options:
  minimumXcodeGenVersion: "2.46.0"
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.9"
    CURRENT_PROJECT_VERSION: "35"
    DEVELOPMENT_LANGUAGE: zh-Hans
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development"
    DEVELOPMENT_TEAM: GU3HYVNR96
    ENABLE_HARDENED_RUNTIME: YES
targets:
  SucculentGarden:
    type: application
    productName: 多肉花园
    platform: macOS
    sources:
      - App
      - Views
      - Components
      - Models
      - Services/SucculentStore.swift
      - Services/MuyuStore.swift
      - Widgets/MuyuTapIntent.swift
      - path: Resources/Assets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.littlecomponent.app
        PRODUCT_NAME: 多肉花园
        PRODUCT_MODULE_NAME: SucculentGarden
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        # macOS compares the unlocalized name with the on-disk bundle name before localizing it.
        CFBundleDisplayName: $(PRODUCT_NAME)
        CFBundleName: $(PRODUCT_NAME)
        CFBundleLocalizations: [zh-Hans]
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        NSPrincipalClass: NSApplication
        LSUIElement: true
        CFBundleURLTypes:
          - CFBundleURLName: local.littlecomponent.garden
            CFBundleURLSchemes: [littlecomponent]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: local.littlecomponent.garden.item
            UTTypeDescription: 多肉花园物品
            UTTypeConformsTo: [public.data]
    entitlements:
      path: App/SucculentGarden.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [GU3HYVNR96.local.littlecomponent.garden]
    dependencies:
      - target: SucculentGardenWidgets
        embed: true
  SucculentGardenWidgets:
    type: app-extension
    productName: LittleComponentWidget
    platform: macOS
    sources:
      - Widgets
      - Components
      - Models
      - Services
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.littlecomponent.app.widget
        PRODUCT_NAME: LittleComponentWidget
        PRODUCT_MODULE_NAME: SucculentGardenWidgets
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: $(PRODUCT_NAME)
        CFBundleName: $(PRODUCT_NAME)
        CFBundleLocalizations: [zh-Hans]
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/SucculentGardenWidgets.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [GU3HYVNR96.local.littlecomponent.garden]
  MuyuTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
      - App/GardenModel.swift
      - Components/WidgetArtworkCache.swift
      - Components/ArtworkImageCache.swift
      - Components/ArtworkImageDecoder.swift
      - Components/SucculentArtworkLayout.swift
      - Components/SucculentArtworkSize.swift
      - Components/SucculentExpansionSize.swift
      - Components/SucculentAtlasLayout.swift
      - Components/AtlasLayouts
      - Models
      - Services
      - path: Resources/proverbs.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.littlecomponent.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  SucculentGarden:
    build:
      targets:
        SucculentGarden: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MuyuTests
    archive:
      config: Release
  SucculentGardenWidgets:
    build:
      targets:
        SucculentGarden: all
        SucculentGardenWidgets: all
    run:
      config: Debug
      executable: LittleComponentWidget
      askForAppToLaunch: true
      launchAutomaticallySubstyle: "2"
      environmentVariables:
        _XCWidgetKind: LittleComponentWidget
        _XCWidgetFamily: medium
        _XCWidgetDefaultView: timeline
